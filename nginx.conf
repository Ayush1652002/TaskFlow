server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing, so any path that isn't a real
    # file (e.g. /analytics, /activity) must still serve index.html and let
    # React Router take over — otherwise a hard refresh on those routes 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built JS/CSS assets aggressively — Vite fingerprints filenames,
    # so a new deploy naturally gets a new filename and busts the cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
